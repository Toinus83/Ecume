name: ecume
services:
  ecume:
    image: ${ECUME_IMAGE:-ecume:offline}
    pull_policy: never
    init: true
    restart: unless-stopped
    ports:
      - "${ECUME_BIND_IP:-127.0.0.1}:${ECUME_PORT:-8080}:8080"
    environment:
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-api}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      EXTERNAL_LLM_BASE_URL: ${EXTERNAL_LLM_BASE_URL:-}
      EXTERNAL_LLM_MODEL: ${EXTERNAL_LLM_MODEL:-}
      EXTERNAL_LLM_API_KEY: ${EXTERNAL_LLM_API_KEY:-}
      ECUME_ALLOW_LLM_FALLBACK: ${ECUME_ALLOW_LLM_FALLBACK:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ecume-data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  ecume-data:
