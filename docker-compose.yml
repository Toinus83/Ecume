name: ecume-dev

services:
  ecume-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ecume-backend:dev
    restart: unless-stopped
    init: true
    ports:
      - "${ECUME_BACKEND_BIND:-127.0.0.1}:${ECUME_BACKEND_PORT:-8000}:8000"
    environment:
      ECUME_ENV: ${ECUME_ENV:-production}
      ECUME_DATA_DIR: /data
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/ecume.db
      ECUME_ENV_PATH: /data/settings.env
      ECUME_CORS_ORIGINS: ${ECUME_CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EXTERNAL_LLM_BASE_URL: ${LLM_API_URL:-}
      EXTERNAL_LLM_MODEL: ${LLM_MODEL:-}
      EXTERNAL_LLM_API_KEY: ${LLM_API_KEY:-}
      ECUME_ALLOW_LLM_FALLBACK: ${ECUME_ALLOW_LLM_FALLBACK:-false}
      ECUME_FUSEKI_ENABLED: ${FUSEKI_ENABLED:-false}
      ECUME_FUSEKI_BASE_URL: ${FUSEKI_BASE_URL:-http://fuseki:3030}
      ECUME_FUSEKI_DATASET: ${FUSEKI_DATASET:-ecume}
      ECUME_FUSEKI_QUERY_ENDPOINT: ${FUSEKI_QUERY_ENDPOINT:-/query}
      ECUME_FUSEKI_UPDATE_ENDPOINT: ${FUSEKI_UPDATE_ENDPOINT:-/update}
      ECUME_FUSEKI_WRITE_MODE: ${FUSEKI_WRITE_MODE:-disabled}
      ECUME_GRAPH_ECHO_OWL: ${FUSEKI_GRAPH_ECHO_OWL:-graph:echo:reference:owl}
      ECUME_GRAPH_ECHO_VOC: ${FUSEKI_GRAPH_ECHO_VOC:-graph:echo:reference:voc}
      ECUME_GRAPH_ECHO_SHACL: ${FUSEKI_GRAPH_ECHO_SHACL:-graph:echo:reference:shacl}
      ECUME_GRAPH_ECUME_CANDIDATES: ${FUSEKI_GRAPH_ECUME_CANDIDATES:-graph:ecume:candidates}
      ECUME_GRAPH_ECUME_VALIDATED: ${FUSEKI_GRAPH_ECUME_VALIDATED:-graph:ecume:validated}
      ECUME_GRAPH_ECUME_REJECTED: ${FUSEKI_GRAPH_ECUME_REJECTED:-graph:ecume:rejected}
      ECUME_GRAPH_ECUME_PROVENANCE: ${FUSEKI_GRAPH_ECUME_PROVENANCE:-graph:ecume:provenance}
      ECUME_GRAPH_ECUME_REVIEW: ${FUSEKI_GRAPH_ECUME_REVIEW:-graph:ecume:review}
      ECUME_ECHO_SOURCE: ${ECUME_ECHO_SOURCE:-unconfigured}
      ECUME_ECHO_DEFAULT_DOMAIN: ${ECUME_ECHO_DEFAULT_DOMAIN:-ECHO_RH}
      ECUME_ECHO_OWL_REFERENCE: ${ECUME_ECHO_OWL_REFERENCE:-}
      ECUME_ECHO_VOC_REFERENCE: ${ECUME_ECHO_VOC_REFERENCE:-}
      ECUME_ECHO_SHACL_REFERENCE: ${ECUME_ECHO_SHACL_REFERENCE:-}
      ECUME_ONTOCAST_ENABLED: ${ONTOCAST_ENABLED:-false}
      ECUME_ONTOCAST_MODE: ${ECUME_ONTOCAST_MODE:-disabled}
      ECUME_ONTOCAST_API_URL: ${ONTOCAST_API_URL:-}
      ONTOCAST_TOKEN: ${ONTOCAST_TOKEN:-}
      ECUME_ONTOCAST_TIMEOUT: ${ECUME_ONTOCAST_TIMEOUT:-120}
      ECUME_ONTOCAST_EXTRACTION_PROFILE: ${ECUME_ONTOCAST_EXTRACTION_PROFILE:-default}
      ECUME_ONTOCAST_USE_FUSEKI: ${ECUME_ONTOCAST_USE_FUSEKI:-false}
      ECUME_ONTOCAST_LOCAL_FALLBACK: ${ECUME_ONTOCAST_LOCAL_FALLBACK:-true}
      ECUME_ONTOSPHERE_ENABLED: ${ECUME_ONTOSPHERE_ENABLED:-false}
      ECUME_ONTOSPHERE_URL: ${ONTOSPHERE_URL:-}
      ECUME_ONTOSPHERE_SPARQL_URL: ${ECUME_ONTOSPHERE_SPARQL_URL:-}
      ECUME_ONTOSPHERE_REVIEW_GRAPH: ${ECUME_ONTOSPHERE_REVIEW_GRAPH:-graph:ecume:review}
      ECUME_RDF_AUTH_TYPE: ${ECUME_RDF_AUTH_TYPE:-none}
      ECUME_RDF_AUTH_USERNAME: ${ECUME_RDF_AUTH_USERNAME:-}
      ECUME_RDF_AUTH_SECRET: ${ECUME_RDF_AUTH_SECRET:-}
      ECUME_RDF_READ_ONLY: ${ECUME_RDF_READ_ONLY:-true}
      ECUME_RDF_WRITE_CANDIDATES_ONLY: ${ECUME_RDF_WRITE_CANDIDATES_ONLY:-true}
      ECUME_RDF_WRITE_VALIDATED: ${ECUME_RDF_WRITE_VALIDATED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ecume-data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ecume-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ecume-frontend:dev
    restart: unless-stopped
    ports:
      - "${ECUME_FRONTEND_BIND:-127.0.0.1}:${ECUME_FRONTEND_PORT:-8080}:80"
    environment:
      ECUME_API_URL: ${ECUME_API_URL:-/api}
      ECUME_BACKEND_UPSTREAM: http://ecume-backend:8000
    depends_on:
      ecume-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ecume-data:
