apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecume-frontend
  namespace: ecume
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecume-frontend
  template:
    metadata:
      labels:
        app: ecume-frontend
    spec:
      containers:
        - name: frontend
          image: ecume-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: ecume-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
