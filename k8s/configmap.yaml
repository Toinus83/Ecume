apiVersion: v1
kind: ConfigMap
metadata:
  name: ecume-config
  namespace: ecume
data:
  ECUME_ENV: production
  ECUME_DATA_DIR: /data
  DATA_DIR: /data
  DATABASE_URL: sqlite:////data/ecume.db
  ECUME_ENV_PATH: /data/settings.env
  ECUME_CORS_ORIGINS: https://ecume.example.local,http://ecume.example.local
  LLM_ENABLED: "false"
  LLM_PROVIDER: ollama
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: llama3.1
  EXTERNAL_LLM_BASE_URL: ""
  EXTERNAL_LLM_MODEL: ""
  ECUME_ALLOW_LLM_FALLBACK: "false"
  ECUME_FUSEKI_ENABLED: "false"
  ECUME_FUSEKI_BASE_URL: http://fuseki:3030
  ECUME_FUSEKI_DATASET: ecume
  ECUME_FUSEKI_QUERY_ENDPOINT: /query
  ECUME_FUSEKI_UPDATE_ENDPOINT: /update
  ECUME_FUSEKI_WRITE_MODE: disabled
  ECUME_GRAPH_ECHO_OWL: graph:echo:reference:owl
  ECUME_GRAPH_ECHO_VOC: graph:echo:reference:voc
  ECUME_GRAPH_ECHO_SHACL: graph:echo:reference:shacl
  ECUME_GRAPH_ECUME_CANDIDATES: graph:ecume:candidates
  ECUME_GRAPH_ECUME_VALIDATED: graph:ecume:validated
  ECUME_GRAPH_ECUME_REJECTED: graph:ecume:rejected
  ECUME_GRAPH_ECUME_PROVENANCE: graph:ecume:provenance
  ECUME_GRAPH_ECUME_REVIEW: graph:ecume:review
  ECUME_ECHO_SOURCE: unconfigured
  ECUME_ECHO_DEFAULT_DOMAIN: ECHO_RH
  ECUME_ECHO_OWL_REFERENCE: ""
  ECUME_ECHO_VOC_REFERENCE: ""
  ECUME_ECHO_SHACL_REFERENCE: ""
  ECUME_ONTOCAST_ENABLED: "false"
  ECUME_ONTOCAST_MODE: disabled
  ECUME_ONTOCAST_API_URL: ""
  ECUME_ONTOCAST_TIMEOUT: "120"
  ECUME_ONTOCAST_EXTRACTION_PROFILE: default
  ECUME_ONTOCAST_USE_FUSEKI: "false"
  ECUME_ONTOCAST_LOCAL_FALLBACK: "true"
  ECUME_ONTOSPHERE_ENABLED: "false"
  ECUME_ONTOSPHERE_URL: ""
  ECUME_ONTOSPHERE_SPARQL_URL: ""
  ECUME_ONTOSPHERE_REVIEW_GRAPH: graph:ecume:review
  ECUME_RDF_AUTH_TYPE: none
  ECUME_RDF_READ_ONLY: "true"
  ECUME_RDF_WRITE_CANDIDATES_ONLY: "true"
  ECUME_RDF_WRITE_VALIDATED: "false"
  ECUME_API_URL: /api
  ECUME_BACKEND_UPSTREAM: http://ecume-backend:8000
